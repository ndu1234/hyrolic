<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyrolic — IFC Viewer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0a0f; color: #e2e8f0; font-family: 'Manrope', sans-serif; }
    bim-viewport { flex: 1; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 48px; background: #13131a; border-bottom: 1px solid #1e293b;
    }
    .logo { font-weight: 700; font-size: 15px; color: #22d3ee; font-family: 'Outfit', sans-serif; }
    .logo span { color: #64748b; font-weight: 400; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .controls select {
      background: #0f0f17; border: 1px solid #1e293b; color: #e2e8f0;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; max-width: 340px; font-family: 'Manrope', sans-serif;
    }
    .status { font-size: 12px; color: #94a3b8; }
    #app {
      display: flex; flex-direction: column; height: 100vh;
    }
    #main {
      display: flex; flex: 1; min-height: 0;
    }
    #viewport-container {
      flex: 1; position: relative;
    }
    bim-panel {
      width: 340px; border-left: 1px solid #1e293b; background: #13131a;
    }
    bim-panel-section { --bim-panel-section--bg: #13131a; }
    .toolbar {
      display: flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: #0f0f17; border-top: 1px solid #1e293b;
    }
    .toolbar button {
      font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(34,211,238,0.3);
      background: rgba(34,211,238,0.08); color: #22d3ee; cursor: pointer; font-family: 'Manrope', sans-serif;
    }
    .toolbar button:hover { background: rgba(34,211,238,0.2); }
    .toolbar button.active { background: rgba(34,211,238,0.35); border-color: #22d3ee; }
    .sep { width: 1px; height: 20px; background: #1e293b; }
    .count { margin-left: auto; font-size: 11px; color: #64748b; }
    #tree { 
      font-size: 12px; padding: 8px 0; 
    }
    .tree-item {
      padding: 3px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: background 0.1s;
    }
    .tree-item:hover { background: rgba(34,211,238,0.08); }
    .tree-item.selected { background: rgba(34,211,238,0.15); color: #22d3ee; }
    .tree-item .icon { font-size: 10px; width: 16px; text-align: center; flex-shrink: 0; }
    .tree-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-item .count { font-size: 10px; color: #64748b; }
    .tree-children { padding-left: 16px; }
    .prop-row {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 11px; padding: 3px 0; border-bottom: 1px solid rgba(30,41,59,0.3);
    }
    .prop-key { color: #64748b; flex-shrink: 0; }
    .prop-val { color: #e2e8f0; text-align: right; word-break: break-word; max-width: 200px; }
    .section-bar {
      display: none; align-items: center; gap: 10px;
      padding: 4px 14px; font-size: 11px; color: #94a3b8;
      background: #0f0f17; border-top: 1px solid #1e293b;
    }
    .section-bar input { flex: 1; accent-color: #fbbf24; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="logo">Hyrolic <span>//</span> IFC Viewer</div>
      <div class="controls">
        <select id="model-select"><option value="">Loading models…</option></select>
        <span class="status" id="model-status">—</span>
      </div>
    </div>

    <div id="main">
      <div id="viewport-container">
        <bim-viewport id="viewport"></bim-viewport>
        <div class="toolbar" id="toolbar">
          <button id="btn-fit">Fit</button>
          <div class="sep"></div>
          <button id="btn-hide">Hide</button>
          <button id="btn-iso">Isolate</button>
          <button id="btn-show">Show All</button>
          <div class="sep"></div>
          <button id="btn-section">Section</button>
          <span class="count" id="elem-count"></span>
        </div>
        <div class="section-bar" id="section-bar">
          <span>Section plane:</span>
          <input type="range" id="section-slider" min="-50" max="50" value="0" step="0.5">
          <span id="section-label">0.0 m</span>
        </div>
      </div>

      <bim-panel id="panel" active label="Model">
        <bim-panel-section label="Model Tree" id="tree-section">
          <div id="tree"></div>
        </bim-panel-section>
        <bim-panel-section label="Properties" id="props-section">
          <div id="props">
            <div style="color:#475569;font-size:12px;text-align:center;padding:20px 0;">
              Click an element in the model to see its properties
            </div>
          </div>
        </bim-panel-section>
      </bim-panel>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
